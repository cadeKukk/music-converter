name: Test converter
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress
      - name: Locate FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tool = Get-ChildItem C:\ProgramData\chocolatey -Filter ffmpeg.exe -Recurse | Where-Object { Test-Path (Join-Path $_.Directory.FullName 'ffprobe.exe') } | Select-Object -First 1
          if (-not $tool) { throw 'FFmpeg and FFprobe not found' }
          $tool.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Run integration tests
        run: python -m unittest discover -s tests -v
